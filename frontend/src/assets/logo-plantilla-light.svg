<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Festive Balloon Cluster & Confetti Icon -->
  <g transform="translate(4, 6)">
    <!-- Yellow Balloon -->
    <ellipse cx="28" cy="18" rx="10" ry="13" fill="#f59e0b" />
    <path d="M28 31 L26 34 L30 34 Z" fill="#d97706" />
    <path d="M28 34 Q30 42 27 46" stroke="#94a3b8" stroke-width="1.2" fill="none"/>

    <!-- Purple Balloon -->
    <ellipse cx="14" cy="20" rx="9" ry="12" fill="#8b5cf6" />
    <path d="M14 32 L12 35 L16 35 Z" fill="#7c3aed" />
    <path d="M14 35 Q11 41 18 47" stroke="#94a3b8" stroke-width="1.2" fill="none"/>

    <!-- Coral Main Balloon -->
    <ellipse cx="22" cy="14" rx="12" ry="15" fill="#f43f5e" />
    <path d="M22 29 L19 33 L25 33 Z" fill="#e11d48" />
    <path d="M22 33 Q20 40 22 48" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <ellipse cx="18" cy="10" rx="3" ry="5" fill="#ffffff" opacity="0.4" transform="rotate(-20 18 10)" />

    <!-- Sparkles -->
    <path d="M38 8 L40 12 L44 14 L40 16 L38 20 L36 16 L32 14 L36 12 Z" fill="#fbbf24" />
    <circle cx="6" cy="12" r="2" fill="#06b6d4" />
    <circle cx="36" cy="30" r="2.5" fill="#10b981" />
  </g>

  <!-- Festive Typography for Dark Backgrounds -->
  <text x="56" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Coti<tspan fill="#f43f5e">Fiesta</tspan></text>
  <text x="57" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" letter-spacing="2">COTILLÓN &amp; EVENTOS</text>
</svg>
